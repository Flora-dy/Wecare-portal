<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="微康研选示范产品矩阵 · 内部评审用">
<title>微康研选产品矩阵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F7F4F3; --surface:#fff; --surface2:#F1ECEA;
  --ink:#241E1D; --soft:#6E6664; --faint:#9A918E;
  --line:#E4DAD8; --brand:#B5121B;
  --s1bg:#B5121B; --s1fg:#fff; --s1chip:rgba(255,255,255,.22);
  --s2bg:#CC5A4E; --s2fg:#fff; --s2chip:rgba(255,255,255,.24);
  --s3bg:#E18E7F; --s3fg:#fff; --s3chip:rgba(255,255,255,.28);
  --s4bg:#F4D5C9; --s4fg:#6B2B21; --s4chip:rgba(181,18,27,.13);
  --s5bg:#E9E5E3; --s5fg:#4A4340; --s5chip:rgba(0,0,0,.08);
  --s6bg:transparent; --s6fg:#8A8280; --s6chip:rgba(0,0,0,.05);
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Heiti SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono","PingFang SC",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14100F; --surface:#1C1817; --surface2:#241F1D;
  --ink:#EDE8E6; --soft:#A79E9B; --faint:#7A7270;
  --line:#332C2A; --brand:#E8574E;
  --s1bg:#C8232C; --s1fg:#fff; --s1chip:rgba(255,255,255,.2);
  --s2bg:#A8423A; --s2fg:#FBEAE8; --s2chip:rgba(255,255,255,.18);
  --s3bg:#7E3830; --s3fg:#F5D8D3; --s3chip:rgba(255,255,255,.16);
  --s4bg:#4A2A25; --s4fg:#EFC4B8; --s4chip:rgba(255,255,255,.12);
  --s5bg:#282220; --s5fg:#A89F9C; --s5chip:rgba(255,255,255,.09);
  --s6bg:transparent; --s6fg:#7A7270; --s6chip:rgba(255,255,255,.07);
}}
:root[data-theme="dark"]{
  --ground:#14100F; --surface:#1C1817; --surface2:#241F1D;
  --ink:#EDE8E6; --soft:#A79E9B; --faint:#7A7270;
  --line:#332C2A; --brand:#E8574E;
  --s1bg:#C8232C; --s1fg:#fff; --s1chip:rgba(255,255,255,.2);
  --s2bg:#A8423A; --s2fg:#FBEAE8; --s2chip:rgba(255,255,255,.18);
  --s3bg:#7E3830; --s3fg:#F5D8D3; --s3chip:rgba(255,255,255,.16);
  --s4bg:#4A2A25; --s4fg:#EFC4B8; --s4chip:rgba(255,255,255,.12);
  --s5bg:#282220; --s5fg:#A89F9C; --s5chip:rgba(255,255,255,.09);
  --s6bg:transparent; --s6fg:#7A7270; --s6chip:rgba(255,255,255,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;line-height:1.55}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px}
@media(max-width:520px){.wrap{padding:0 16px}}

/* 头部 */
header{padding-block:26px 0}
.hrow{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;
      border-bottom:3px solid var(--brand);padding-bottom:12px}
h1{margin:0;font-size:clamp(21px,3.4vw,29px);font-weight:800;letter-spacing:.04em}
h1 b{color:var(--brand);font-weight:800}
.note{margin:6px 0 0;font-size:12.5px;color:var(--soft)}
.tots{display:flex;gap:18px}
.tot{text-align:right}
.tot b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1;color:var(--brand)}
.tot.n b{color:var(--ink)}
.tot span{font-size:10.5px;color:var(--faint);display:block;margin-top:4px;white-space:nowrap}

/* 推进条 */
.pipe{display:flex;margin-top:18px;border-radius:4px;overflow:hidden;min-height:34px;flex-wrap:wrap}
.pipe button{border:0;cursor:pointer;font-family:var(--sans);font-size:11.5px;font-weight:600;
  padding:8px 8px;color:inherit;transition:filter .15s;min-width:0;line-height:1.3;
  overflow:hidden}
@media(min-width:701px){.pipe button{white-space:nowrap;text-overflow:ellipsis}}
.pipe button:hover{filter:brightness(1.07)}
@media(max-width:700px){
  .pipe{gap:3px;border-radius:0;background:var(--ground);min-height:0}
  .pipe button{flex:1 1 calc(50% - 3px)!important;border-radius:3px;padding:8px 9px;
    text-align:left;min-height:38px;display:flex;align-items:center}
}
.pipe button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.pipe button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:13px}
.flabel{font-size:11px;color:var(--faint);margin-right:3px;letter-spacing:.04em}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--soft);
  cursor:pointer;border-radius:3px;font-size:11.5px;padding:4px 11px;font-family:var(--sans);
  transition:background .14s,border-color .14s,color .14s;white-space:nowrap}
.filters button:hover{border-color:var(--faint);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);
  color:var(--ground);font-weight:600}
.filters button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.hint{font-size:11.5px;color:var(--faint);margin:10px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.reset{border:1px solid var(--line);background:var(--surface);color:var(--soft);cursor:pointer;
  border-radius:3px;font-size:11px;padding:3px 9px;font-family:var(--sans)}
.reset:hover{border-color:var(--faint);color:var(--ink)}

/* 品类竖列 */
main{padding-block:14px 40px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:13px;align-items:start}
@media(max-width:1180px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:880px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.cathead{border-top:2px solid var(--ink);padding-top:7px;margin-bottom:0}
.cathead h2{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.01em;line-height:1.35}
.cathead span{font-family:var(--mono);font-size:10.5px;color:var(--faint);display:block;margin-top:2px}

.card{border:0;text-align:left;font-family:var(--sans);border-radius:5px;padding:11px 11px 10px;
  cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:112px;min-width:0;
  transition:transform .14s ease, box-shadow .14s ease;color:inherit}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(36,30,29,.45)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card .nm{font-size:12.6px;font-weight:700;line-height:1.35;overflow-wrap:break-word;word-break:normal}
.card .cfu{font-family:var(--mono);font-size:17.5px;font-weight:600;line-height:1.05;letter-spacing:-.01em}
.card .cfu em{font-style:normal;font-size:10.5px;font-weight:500;opacity:.85;letter-spacing:0}
.card .mk{font-size:10.5px;opacity:.9;margin-top:auto;line-height:1.45}
.card .st{font-size:10.5px;font-weight:600;line-height:1.4}
.card .tag{display:inline-block;font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:2px;
  letter-spacing:.04em;align-self:flex-start;margin-bottom:1px}
.s1{background:var(--s1bg);color:var(--s1fg)} .s1 .tag{background:var(--s1chip)}
.s2{background:var(--s2bg);color:var(--s2fg)} .s2 .tag{background:var(--s2chip)}
.s3{background:var(--s3bg);color:var(--s3fg)} .s3 .tag{background:var(--s3chip)}
.s4{background:var(--s4bg);color:var(--s4fg)} .s4 .tag{background:var(--s4chip)}
.s5{background:var(--s5bg);color:var(--s5fg)} .s5 .tag{background:var(--s5chip)}
.s6{background:var(--s6bg);color:var(--s6fg);border:1.5px dashed var(--line)} .s6 .tag{background:var(--s6chip)}
.card.dim{opacity:.22;pointer-events:none}

/* 详情 */
dialog{border:0;padding:0;background:transparent;max-width:680px;width:calc(100% - 32px);
  color:var(--ink)}
dialog::backdrop{background:rgba(20,16,15,.55);backdrop-filter:blur(2px)}
.sheet{background:var(--surface);border-radius:7px;overflow:hidden;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5);max-height:86vh;display:flex;flex-direction:column}
.shead{padding:16px 20px 14px;display:flex;gap:14px;align-items:flex-start}
.shead h3{margin:0;font-size:18px;font-weight:700;line-height:1.3}
.shead .c{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1;margin-top:5px}
.shead .c em{font-style:normal;font-size:12px;font-weight:500;opacity:.85}
.x{margin-left:auto;border:0;background:var(--s5chip);color:inherit;cursor:pointer;
  width:28px;height:28px;border-radius:50%;font-size:17px;line-height:1;flex:none}
.x:hover{background:var(--s4chip)}
.sbody{padding:4px 20px 20px;overflow-y:auto}
.fld{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);
  font-size:13px;align-items:start}
.fld dt{color:var(--faint);font-size:11.5px;padding-top:2px}
.fld dd{margin:0;line-height:1.6;word-break:break-word}
.strains{display:flex;flex-wrap:wrap;gap:5px}
.strain{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:3px;
  padding:2px 7px;background:var(--surface2)}
.sell li{margin-bottom:3px}
.sell{margin:0;padding-left:17px}
.price{font-family:var(--mono);color:var(--brand);font-weight:600}
.sfoot{padding:11px 20px;background:var(--surface2);font-size:11px;color:var(--faint);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hrow">
    <div>
      <h1>微康研选 · <b>产品矩阵</b></h1>
      <p class="note">按品类分区，颜色标示推进阶段（越红越接近上市）。点任意一款看完整规格、菌株与配方。</p>
    </div>
    <div class="tots">
      <div class="tot"><b>24</b><span>示范产品</span></div>
      <div class="tot"><b>7</b><span>品类</span></div>
      <div class="tot n"><b>14</b><span>自产</span></div>
      <div class="tot n"><b>6</b><span>委外</span></div>
      <div class="tot n"><b>4</b><span>待定 / 待补</span></div>
    </div>
  </div>
  <div class="pipe" id="pipe"></div>
  <div class="filters" id="modeFilter"><span class="flabel">生产方式</span></div>
  <p class="hint"><span id="hintText">点色条按推进阶段筛选，可与生产方式叠加</span>
     <button class="reset" id="reset" hidden>清除筛选</button></p>
</header>

<main id="main"></main>
</div>

<dialog id="dlg"><div class="sheet">
  <div class="shead">
    <div>
      <h3 id="dTitle"></h3>
      <div class="c" id="dCfu"></div>
    </div>
    <button class="x" id="dClose" aria-label="关闭">×</button>
  </div>
  <div class="sbody"><dl id="dBody"></dl></div>
  <div class="sfoot"><span>数据截至 2026 年 9 月 17 日</span></div>
</div></dialog>

 {name:"乳品",                 ids:[6,11]},
 {name:"饮料",                 ids:[12,13,14,15]},
 {name:"日化",                 ids:[17]}];
const STAGES=[
 {k:1,label:"生产中 / 已下单"},{k:2,label:"配方 / 包装确认"},
 {k:3,label:"打样中"},{k:4,label:"代工厂筛选"},
 {k:5,label:"待下单"},{k:6,label:"信息待补"}];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const count=k=>Object.values(P).filter(p=>p.stage===k).length;

// 推进条
document.getElementById('pipe').innerHTML = STAGES.map(s=>{
  const n=count(s.k);
  return `<button class="s${s.k}" data-k="${s.k}" aria-pressed="false" style="flex:${n+2}"
     title="${esc(s.label)} ${n} 款">${esc(s.label)} ${n}</button>`;
}).join('');

// 卡片
document.getElementById('main').innerHTML = '<div class="grid">' + CATS.map(c=>`
  <div class="col" data-cat>
    <div class="cathead"><h2>${esc(c.name)}</h2><span>${c.ids.length} 款</span></div>
    ${c.ids.map(id=>{
      const p=P[id]; const mode=(p['生产方式']||'待填').replace(/（.*/,'');
      const cfu=p.cfu?p.cfu.replace(/^([\d]+亿)\s*(.*)$/,'$1<em> $2</em>'):'<em>活菌数待补</em>';
      return `<button class="card s${p.stage}" data-id="${id}">
        <span class="nm">${esc(p.short||p.name)}</span>
        <span class="cfu">${cfu}</span>
        <span class="mk">${esc(mode)}${p['零售价']?' · '+esc(p['零售价'].split('，')[0]):''}</span>
        <span class="st">${esc(p['当前状态']||'信息待补')}</span>
      </button>`;}).join('')}
  </div>`).join('') + '</div>';

// 生产方式分类
const modeKey=p=>{const m=p['生产方式'];
  if(!m) return 'blank';
  if(m.startsWith('自产')) return 'self';
  if(m.startsWith('委外')) return 'out';
  return 'tbd';};
const MODES=[{k:'all',label:'全部'},{k:'self',label:'自产'},
             {k:'out',label:'委外'},{k:'tbd',label:'待定'},{k:'blank',label:'待填'}];
const mCount=k=>k==='all'?Object.keys(P).length:Object.values(P).filter(p=>modeKey(p)===k).length;
document.getElementById('modeFilter').insertAdjacentHTML('beforeend',
  MODES.map(m=>`<button data-m="${m.k}" aria-pressed="${m.k==='all'}">${m.label} ${mCount(m.k)}</button>`).join(''));

// 筛选（阶段 × 生产方式，可叠加）
let active=null, activeMode='all';
const reset=document.getElementById('reset'), hint=document.getElementById('hintText');
function applyFilter(){
  let shown=0;
  document.querySelectorAll('.card').forEach(el=>{
    const p=P[el.dataset.id];
    const ok=(active===null || +p.stage===active) && (activeMode==='all' || modeKey(p)===activeMode);
    el.classList.toggle('dim', !ok);
    if(ok) shown++;
  });
  document.querySelectorAll('[data-cat]').forEach(sec=>{
    sec.hidden = !sec.querySelector('.card:not(.dim)');
  });
  document.querySelectorAll('#pipe button').forEach(b=>
    b.setAttribute('aria-pressed', String(+b.dataset.k===active)));
  document.querySelectorAll('#modeFilter button').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.m===activeMode)));
  const on = active!==null || activeMode!=='all';
  reset.hidden = !on;
  if(!on){ hint.textContent='点色条按推进阶段筛选，可与生产方式叠加'; }
  else{
    const parts=[];
    if(active!==null) parts.push(STAGES.find(s=>s.k===active).label);
    if(activeMode!=='all') parts.push(MODES.find(m=>m.k===activeMode).label);
    hint.textContent = parts.join(' + ') + ' — ' + shown + ' 款';
  }
}
document.getElementById('pipe').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  active = (+b.dataset.k===active) ? null : +b.dataset.k; applyFilter();
});
document.getElementById('modeFilter').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  activeMode = b.dataset.m; applyFilter();
});
reset.addEventListener('click',()=>{active=null;activeMode='all';applyFilter();});

// 详情
const dlg=document.getElementById('dlg');
const FIELDS=["卖点","规格","菌株","配方","保质期","储存条件","生产方式","零售价","当前状态","负责人"];
function render(v,f){
  if(f==="菌株") return `<div class="strains">${v.split('\n').map(s=>`<span class="strain">${esc(s)}</span>`).join('')}</div>`;
  if(f==="零售价") return `<span class="price">${esc(v)}</span>`;
  if(f==="卖点" && /[1-9][.、]/.test(v)){
    const items=v.split(/(?=[1-9][.、])/).map(s=>s.replace(/^[1-9][.、]\s*/,'').replace(/[；;]$/,'').trim()).filter(Boolean);
    if(items.length>1) return `<ol class="sell">${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`;
  }
  return esc(v).replace(/\n/g,'<br>');
}
document.getElementById('main').addEventListener('click',e=>{
  const b=e.target.closest('.card'); if(!b) return;
  const p=P[b.dataset.id];
  document.getElementById('dTitle').textContent=p.name;
  document.getElementById('dCfu').innerHTML = p.cfu
    ? p.cfu.replace(/^([\d]+亿)\s*(.*)$/,'$1<em> $2</em>') : '<em style="opacity:.6">活菌数待补</em>';
  document.getElementById('dBody').innerHTML = FIELDS.filter(f=>p[f])
    .map(f=>`<div class="fld"><dt>${f}</dt><dd>${render(p[f],f)}</dd></div>`).join('')
    || '<div class="fld"><dt>—</dt><dd>这一款尚未填写任何信息。</dd></div>';
  dlg.showModal();
});
document.getElementById('dClose').addEventListener('click',()=>dlg.close());
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
applyFilter();
</script>
</body>
</html>
